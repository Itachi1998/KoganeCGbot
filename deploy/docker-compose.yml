# Run the new bot with Redis on one machine (an EC2 instance, say):
#   cp deploy/.env.example deploy/.env   # then put your bot token in it
#   docker compose -f deploy/docker-compose.yml up -d --build
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - redis:/data
    restart: unless-stopped

  bot:
    build:
      context: ..
      dockerfile: deploy/ai-bot.Dockerfile
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      REDIS_REQUIRED: "1"                 # refuse to start without the battle cache
      CULLING_DB: ${CULLING_DB:-sqlite}
      CULLING_SQLITE: /data/culling.db
    volumes:
      - gamedata:/data                    # the SQLite database lives here: back this up
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  redis:
  gamedata:
