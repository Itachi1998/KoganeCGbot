name: Build and Push Docker Image with Cosign OIDC

on:
  push:
    branches:
      - main

permissions:
  id-token: write # Required for signing with OIDC
  contents: read # For actions/checkout

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USER }}
        password: ${{ secrets.DOCKER_TOKEN }}

    - name: Build and push Docker image
      id: build-push
      uses: docker/build-push-action@v3
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKER_USER }}/koganehub:latest
        provenance: true # Generate SLSA provenance
        sbom: true # Generate SBOM
        outputs: |
          image: ${{ steps.build-push.outputs.digest }}

    - name: Set up Cosign
      uses: sigstore/cosign-installer@v3


    - name: Upload SBOM Artifact
      uses: actions/upload-artifact@v4.6.2
      with:
        name: sbom.cdx.json
        path: sbom.cdx.json

    - name: Sign SBOM with Cosign (OIDC)
      run: cosign attach sbom --sbom sbom.cdx.json -key "github://${{ github.repository }}/${{ github.workflow_ref }}@v1" ${{ steps.build-push.outputs.image }}

    - name: Generate Shasum
      id: shasum
      run: |
        echo "SHASUM=$(echo ${{ steps.build-push.outputs.image }} | cut -d':' -f2)" >> $GITHUB_OUTPUT

    - name: Sign Shasum with Cosign (OIDC)
      run: cosign sign --annotation "shasum=${{ steps.shasum.outputs.SHASUM }}" -key "github://${{ github.repository }}/${{ github.workflow_ref }}@v1" ${{ steps.build-push.outputs.image }}
