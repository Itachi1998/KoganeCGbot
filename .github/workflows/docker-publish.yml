name: Build and Push Docker Image with Cosign OIDC

on:
  push:
    branches:
      - main

permissions:
  id-token: write # Required for signing with OIDC
  contents: read # For actions/checkout

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2
      with:
        fetch-depth: 0 # Ensure full history is fetched

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USER }}
        password: ${{ secrets.DOCKER_TOKEN }}

    - name: Build and push Docker image
      id: build-push
      uses: docker/build-push-action@v3
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKER_USER }}/koganehub:latest
        provenance: true
        sbom: true

    - name: Sign Image with Cosign using OIDC
      run: |
        cosign sign --oidc ${{ steps.build-push.outputs.image }}
