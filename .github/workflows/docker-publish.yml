name: Build and Push Docker Image with Cosign OIDC

on:
  push:
    branches:
      - main

permissions:
  id-token: write # Required for signing with OIDC
  contents: read # For actions/checkout

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2
      with:
        fetch-depth: 0 # Ensure full history is fetched

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USER }}
        password: ${{ secrets.DOCKER_TOKEN }}

    - name: Build and push Docker image
      id: build-push
      uses: docker/build-push-action@v3
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKER_USER }}/koganehub:latest
        provenance: true
        sbom: true
        outputs:
          image: ${{ steps.build-push.outputs.image }} # Corrected outputs syntax

    - name: Set up Cosign
      uses: sigstore/cosign-installer@v3

    - name: Generate SBOM (Syft)
      id: sbom
      uses: syft-tooling/syft-github-action@v1 # Using syft-tooling org
      with:
        image: ${{ steps.build-push.outputs.image }}
        file: sbom.spdx

    - name: Upload SBOM Artifact
      uses: actions/upload-artifact@v4.6.2
      with:
        name: sbom.spdx
        path: sbom.spdx

    - name: Sign SBOM with Cosign
      run: |
        echo "Image: ${{ steps.build-push.outputs.image }}" # Debugging
        cosign attach sbom --sbom sbom.spdx ${{ steps.build-push.outputs.image }}

    - name: Generate Shasum
      id: shasum
      run: |
        echo "SHASUM=$(echo ${{ steps.build-push.outputs.image }} | cut -d':' -f2)" >> $GITHUB_OUTPUT
        echo "Image: ${{ steps.build-push.outputs.image }}" # Debugging

    - name: Sign Shasum with Cosign
      run: |
        echo "Image: ${{ steps.build-push.outputs.image }}" # Debugging
        cosign sign --annotation "shasum=${{ steps.shasum.outputs.SHASUM }}" ${{ steps.build-push.outputs.image }}
        
